name: capture-stream-url

# Corre un emulador Android (con KVM) en la nube, instala el APK, arranca Frida
# como root y captura la URL/firma real que el motor Titan/Ranger genera al
# reproducir. Nada corre en tu PC. Ejecutar manualmente desde la pestaña Actions.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Segundos de captura"
        default: "240"
      taps:
        description: 'Navegación a una PELÍCULA. Tokens: "text:Movies" "key:N"(19-23 D-pad) "sleep:N" "x,y". Vacío = intento VOD por defecto. Ej: text:Movies sleep:6 key:20 key:23 sleep:8 key:23'
        default: ""
      package:
        description: "Package name del APK"
        default: "com.lite.fczx"
      exit_node:
        description: "IP Tailscale del exit node (tu PC residencial). Vacío = sin túnel (será bloqueado)."
        default: ""
      block_p2p:
        description: 'Bloquear P2P (udp/5333) para forzar HTTP y capturar la URL real del CDN: "true"/"false"'
        default: "false"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar frida-tools
        # Frida 17 rompió la API clásica (Java global, Module.findExportByName) que
        # usa el hook. Fijamos la rama 16.x (frida-tools 13.x) donde funciona tal cual.
        run: pip install --quiet "frida-tools<14"

      - name: Obtener APK
        env:
          APK_URL: ${{ secrets.APK_URL }}
        run: |
          if [ ! -f app.apk ] && [ -n "${APK_URL:-}" ]; then
            echo "Descargando APK desde APK_URL..."
            curl -fsSL "$APK_URL" -o app.apk
          fi
          if [ ! -f app.apk ]; then
            echo "::error::No hay app.apk (ni committeado ni APK_URL secret)"; exit 1
          fi
          ls -la app.apk

      - name: Emulador + captura
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PKG: ${{ github.event.inputs.package }}
          DUR: ${{ github.event.inputs.duration }}
          TAPS: ${{ github.event.inputs.taps }}
          EXIT_NODE: ${{ github.event.inputs.exit_node }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          BLOCK_P2P: ${{ github.event.inputs.block_p2p }}
        with:
          api-level: 30
          target: google_apis        # google_apis (NO playstore) => permite adb root
          arch: x86_64               # API 30 x86_64 trae traducción ARM (el APK es solo-ARM)
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          force-avd-creation: true
          disable-animations: true
          # -tcpdump captura TODO el tráfico del guest a pcap (agnóstico a la traducción ARM):
          # ahí veremos la petición real al CDN (HTTP con firma, o HTTPS con solo el host, o UDP P2P).
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -tcpdump ${{ github.workspace }}/guest.pcap
          script: bash capture.sh

      - name: Analizar pcap del guest (emulador ya apagado -> buffer volcado)
        if: always()
        run: |
          sudo apt-get install -y tcpdump >/dev/null 2>&1 || true
          mkdir -p capture
          PCAP="${{ github.workspace }}/guest.pcap"
          if [ -f "$PCAP" ]; then
            cp "$PCAP" capture/guest.pcap || true
            echo "== tamaño pcap ==" ; ls -la "$PCAP"
            # Todos los endpoints (IP:puerto) contactados por el guest 10.0.2.15:
            tcpdump -r "$PCAP" -nn 2>/dev/null | awk '{print $3" > "$5}' | sort | uniq -c | sort -rn \
              > capture/pcap-endpoints.txt || true
            # SOLO tráfico HTTP en claro (puerto 80). El motor baja el ORIGEN del media por
            # HTTP Range -> aquí está el GET real al CDN (host + ruta + token + Range).
            tcpdump -r "$PCAP" -nn -A -s0 'tcp port 80' 2>/dev/null \
              | tr -d '\r' \
              | grep -aE '^(GET|POST|PUT|HEAD) |^Host: |^Range: |^User-Agent: |^Authorization: ' \
              | grep -aviE 'portalCore|/public/images|/public/subs|/notice/|/MarketServer|/epg/|umeng|crashlytics|generate_204|/adserver/' \
              > capture/pcap-http80.txt || true
            # Filtro fino: lo que huele al ORIGEN del media (rangos/ts/m3u8/vod).
            grep -aiE 'GET .*(\.ts|\.m3u8|/vod/|/media|/live/|seg|range)|^Host: |^Range: |bytes=' capture/pcap-http80.txt \
              > capture/pcap-media-origin.txt || true
            # Todos los hosts HTTP contactados (para ver el CDN aunque cambie la ruta).
            grep -aE '^Host: ' capture/pcap-http80.txt | sort | uniq -c | sort -rn > capture/pcap-http-hosts.txt || true
            # ¿Hay conexiones a los hosts CDN o a puertos de tracker P2P (5333)?
            tcpdump -r "$PCAP" -nn 2>/dev/null | grep -aiE '\.5333|iu15fg7dn|rh6ngfv34|halfgil|xdt3cdevc' \
              > capture/pcap-p2p-cdn.txt || true
            echo "endpoints:"; cat capture/pcap-endpoints.txt || true
          else
            echo "::warning::no se generó guest.pcap"
          fi

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture
          path: capture/
          if-no-files-found: warn
